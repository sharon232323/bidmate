{% extends "base.html" %}

{% block content %}

<section class="contact-container">

    <div class="contact-card">

        <h1>Contact Us</h1>

        <p>
            Have questions, suggestions or partnership ideas?
            Reach out to the BidMate team.
        </p>

        <form class="contact-form">

            <input
                type="text"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                placeholder="Your Email"
                required
            >

            <textarea
                placeholder="Your Message"
                rows="6"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

{% endblock %}
