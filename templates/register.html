{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <form method="POST">

            <div class="form-group">
                <input
                type="text"
                name="username"
                placeholder="Username"
                required>
            </div>

            <div class="form-group">
                <input
                type="email"
                name="email"
                placeholder="College Email"
                required>
            </div>

            <div class="form-group">
                <input
                type="text"
                name="college"
                placeholder="College Name"
                required>
            </div>

            <div class="form-group">
                <input
                type="password"
                name="password"
                placeholder="Password"
                required>
            </div>

            <button class="btn">
                Register
            </button>

        </form>

        <br>

        <p>
            Already have account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>

{% endblock %}
