{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h1>Login</h1>

    <form method="POST">

        <div class="form-group">

            <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        </div>

        <div class="form-group">

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        </div>

        <button class="btn">
            Login
        </button>

    </form>

</div>

{% endblock %}
